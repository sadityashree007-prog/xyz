<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC QUIZs | Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <div class="hero-shell">
    <header class="hero-header">
      <div class="brand-block">
        <img src="ashoka.jpg" alt="Ashoka Logo" class="brand-logo">
        <div>
          <p class="brand-kicker">Learning Platform</p>
          <h1>UPSC QUIZs</h1>
        </div>
      </div>
      <nav class="hero-nav">
        <a href="index.html">Home</a>
      </nav>
    </header>

    <main class="hero-content">
      <section class="hero-copy">
        <p class="section-label">Smart Practice Hub</p>
        <h2>Explore multiple quizzes with one clean experience.</h2>
        <p class="hero-text">Choose a quiz set below to begin. Filter by exam type or sort as per your preference.</p>
      </section>

      <div class="controls-wrapper">
        <div class="filter-tabs" id="filterTabs">
          <button class="tab-btn active" onclick="handleFilter('All', event)">All Tests</button>
          <button class="tab-btn" onclick="handleFilter('Practice SETs', event)">Practice SETs</button>
          <button class="tab-btn" onclick="handleFilter('PYQ', event)">PYQs</button>
          <button class="tab-btn" onclick="handleFilter('Economics', event)">Economics</button>
          <button class="tab-btn" onclick="handleFilter('Test Series', event)">Test Series</button>
          <button class="tab-btn" onclick="handleFilter('BA', event)">BA</button>
        </div>
        
        <div class="sort-box">
          <label for="quizSort">Sort By: </label>
          <select id="quizSort" onchange="handleSort(this.value)">
            <option value="latest">Last Updated (नवीनतम)</option>
            <option value="az">Alphabetical (A - Z)</option>
            <option value="za">Alphabetical (Z - A)</option>
          </select>
        </div>
      </div>

      <section class="quiz-grid" id="quizGrid"></section>
    </main>
  </div>

  <script>
    // Cleaned quizzes array - removed truncated entries and placeholders
   const quizzes = [
  // Test Series (Numbered)
  { name: 'DTS 2701', file: '101.json', link: 'quiz.html?quiz=101.json', category: 'Test Series', lastUpdated: '2026-07-12' },
  { name: 'DTS 2702', file: '102.json', link: 'quiz.html?quiz=102.json', category: 'Test Series', lastUpdated: '2026-07-20' },
  { name: 'DTS 2703', file: '103.json', link: 'quiz.html?quiz=103.json', category: 'Test Series', lastUpdated: '2026-08-01' },
  { name: 'DTS 2704', file: '104.json', link: 'quiz.html?quiz=104.json', category: 'Test Series', lastUpdated: '2026-08-02' },
  { name: 'DTS 2705', file: '109.json', link: 'quiz.html?quiz=109.json', category: 'Test Series', lastUpdated: '2026-08-09' },
  { name: 'DTS C2701', file: '108.json', link: 'quiz.html?quiz=108.json', category: 'Test Series', lastUpdated: '2026-08-01' },
  { name: 'DTS C2702', file: '110.json', link: 'quiz.html?quiz=110.json', category: 'Test Series', lastUpdated: '2026-08-08' },

  // PYQs (Indian Polity & Constitution)
  { name: 'Commissions, Councils, Tribunals, Schedules & Articles', file: 'CommissionsCouncilsTribunalsSchedulesArticles.json', link: 'quiz.html?quiz=CommissionsCouncilsTribunalsSchedulesArticles.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Constitutional Amendments & Local Self Government', file: 'ConstitutionalAmendmentsLocalSelfGovernment.json', link: 'quiz.html?quiz=ConstitutionalAmendmentsLocalSelfGovernment.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Executive', file: 'Executive.json', link: 'quiz.html?quiz=Executive.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Fundamental Duties & DPSP', file: 'FundamentaldutiesDPSP.json', link: 'quiz.html?quiz=FundamentaldutiesDPSP.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Fundamental Rights', file: 'Fundamentalrights.json', link: 'quiz.html?quiz=Fundamentalrights.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Judiciary', file: 'Judiciary.json', link: 'quiz.html?quiz=Judiciary.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Legislature', file: 'Legislature.json', link: 'quiz.html?quiz=Legislature.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Miscellaneous Topics of Indian Constitution and Polity', file: 'MiscellaneousTopicsofIndianConstitutionandPolity.json', link: 'quiz.html?quiz=MiscellaneousTopicsofIndianConstitutionandPolity.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  { name: 'Preamble', file: 'Preamble.json', link: 'quiz.html?quiz=Preamble.json', category: 'PYQs', lastUpdated: '2026-08-16' },
  
  // BA Digital Awareness Series
  { name: 'Digital Awareness BA All IMP Q.P1', file: '105.json', link: 'quiz.html?quiz=105.json', category: 'BA', lastUpdated: '2026-08-02' },
  { name: 'Digital Awareness BA All IMP Q.P2', file: '106.json', link: 'quiz.html?quiz=106.json', category: 'BA', lastUpdated: '2026-08-02' },
  { name: 'Digital Awareness BA All IMP Q.P3', file: '107.json', link: 'quiz.html?quiz=107.json', category: 'BA', lastUpdated: '2026-08-02' },

  // Economics MCQs
  { name: 'Banking 50 MCQs', file: 'Banking 50 MCQs.json', link: 'quiz.html?quiz=Banking 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Basic Introduction of economics 50 MCQs', file: 'Basic Introduction of economics 50 MCQs.json', link: 'quiz.html?quiz=Basic Introduction of economics 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'India\'s securities market 50 MCQs', file: 'India\'s securities market 50 MCQs.json', link: 'quiz.html?quiz=India\'s securities market 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Inflation 50 MCQs', file: 'Inflation 50 MCQs.json', link: 'quiz.html?quiz=Inflation 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Monetary policy 50 MCQs', file: 'Monetary policy 50 MCQs.json', link: 'quiz.html?quiz=Monetary policy 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Money and Money Supply 50 MCQs', file: 'Money and Money Supply 50 MCQs.json', link: 'quiz.html?quiz=Money and Money Supply 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'National Income 50 MCQs', file: 'National Income 50 MCQs.json', link: 'quiz.html?quiz=National Income 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Tax 50 MCQs', file: 'Tax 50 MCQs.json', link: 'quiz.html?quiz=Tax 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },
  { name: 'Growth vs Development 50 MCQs', file: 'growth vs devlopment 50 MCQs.json', link: 'quiz.html?quiz=growth vs devlopment 50 MCQs.json', category: 'Economics', lastUpdated: '2026-08-02' },

  // Practice SETs
  { name: 'SET-A Mentorship 2027', file: 'SET-A.json', link: 'quiz.html?quiz=SET-A.json', category: 'Practice SETs', lastUpdated: '2026-06-02' },
  { name: 'SET-C Mentorship 2027', file: 'SET-C.json', link: 'quiz.html?quiz=SET-C.json', category: 'Practice SETs', lastUpdated: '2026-06-02' },
  { name: 'SET-D Mentorship 2027', file: 'SET-D.json', link: 'quiz.html?quiz=SET-D.json', category: 'Practice SETs', lastUpdated: '2026-06-02' }
];
    let currentCategory = 'All';
    let currentSortOrder = 'latest';
    const grid = document.getElementById('quizGrid');

    function renderQuizzes() {
      let result = currentCategory === 'All' 
        ? [...quizzes] 
        : quizzes.filter(q => q.category === currentCategory);

      if (currentSortOrder === 'az') {
        result.sort((a, b) => a.name.localeCompare(b.name));
      } else if (currentSortOrder === 'za') {
        result.sort((a, b) => b.name.localeCompare(a.name));
      } else if (currentSortOrder === 'latest') {
        result.sort((a, b) => new Date(b.lastUpdated) - new Date(a.lastUpdated));
      }

      if (result.length === 0) {
        grid.innerHTML = `<p class="no-tests">इस श्रेणी में अभी कोई टेस्ट उपलब्ध नहीं है।</p>`;
        return;
      }

      grid.innerHTML = result.map(q => `
        <a class="quiz-card" href="${q.link}">
          <span class="card-badge">${q.category}</span>
          <h3>${q.name}</h3>
          <p>Updated: ${q.lastUpdated}</p>
          <span>Start Quiz →</span>
        </a>
      `).join('');
    }

    function handleFilter(category, event) {
      currentCategory = category;
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      renderQuizzes();
    }

    function handleSort(order) {
      currentSortOrder = order;
      renderQuizzes();
    }

    renderQuizzes();
  </script>
</body>
</html>
